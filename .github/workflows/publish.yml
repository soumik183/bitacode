name: Publish

# Builds and publishes the CLI to npm when a release is approved.
#
# Two ways in:
#  1. Automatic — a pull request is merged into main. The version in
#     package.json is published as-is.
#  2. Manual — Actions → Publish → Run workflow. Picks the bump
#     (patch/minor/major) or publishes the current version.
#
# Publishing is gated by the `npm-release` environment, so it waits for a
# required reviewer to approve before any credential is used. Configure it at
# Settings → Environments → npm-release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        default: patch
        options: [none, patch, minor, major]
      dry_run:
        description: 'Build and pack only, do not publish'
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # Don't republish a version that already exists (e.g. a docs-only merge).
  guard:
    name: check version is new
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Is this version already on npm?
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new; will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: verify and pack
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - name: Confirm dist/ is committed and current
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git status --porcelain dist
            exit 1
          fi

      - name: Smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js --help >/dev/null || true

      - name: Pack tarball
        run: npm pack --pack-destination .

      - name: Dry-run install from the tarball
        # Catches a broken "files"/"bin" setup before a real publish.
        run: |
          TARBALL=$(ls bitacode-*.tgz | head -1)
          echo "packed: $TARBALL"
          mkdir -p /tmp/install-check && cd /tmp/install-check
          npm init -y >/dev/null
          npm install "/home/runner/work/bitacode/bitacode/$TARBALL" --no-audit --no-fund
          npx bitacode --version

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: '*.tgz'
          retention-days: 7

  publish:
    name: publish to npm
    needs: [guard, build]
    # Only publish when there is something new, and never on a dry run.
    if: needs.guard.outputs.publish == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/bitacode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Bump version (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "New version: $(node -p "require('./package.json').version")"

      - uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Publish
        run: npm publish "$(ls bitacode-*.tgz | head -1)" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create a GitHub Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.guard.outputs.version }}
          generate_release_notes: true
          name: v${{ needs.guard.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo "\`bitacode@${{ needs.guard.outputs.version }}\` is live."
            echo
            echo '```bash'
            echo "npx bitacode@${{ needs.guard.outputs.version }}"
            echo "npm i -g bitacode"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
