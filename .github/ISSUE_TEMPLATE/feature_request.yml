name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you hit, not just the solution you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing tools that do this.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - TUI / rendering
        - Agent loop / tools
        - Providers / models
        - Sessions
        - Skills / MCP / sub-agents
        - Docs
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - label: I am willing to open a PR for this
          required: false
