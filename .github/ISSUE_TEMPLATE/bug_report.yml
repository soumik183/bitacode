name: Bug report
description: Something in bitacode behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please scrub API keys, tokens, and file paths you do not want public.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behaviour you wanted.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. run `bitacode`
        2. ask ...
        3. press ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: bitacode version
      description: Output of `bitacode --version`.
      placeholder: 0.1.21
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node -v`.
      placeholder: v22.11.0
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: OS and terminal
      placeholder: Android + Termux, macOS + iTerm2, Windows + Windows Terminal
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: openrouter / openrouter/free
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or transcript
      description: Relevant output, ideally with the surrounding lines.
      render: shell
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        For layout, scrolling, or rendering bugs a short screen recording is the fastest way to a fix.
